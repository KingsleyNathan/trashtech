{% extends "layouts/base.html" %}

{% block title %} Tables {% endblock title %}

{% block content %}

    <div class="container-fluid py-2">
      <div class="row">
        <div class="col-12">
          <div class="card my-4">
            <div class="card-header p-0 position-relative mt-n4 mx-3 z-index-2">
              <div class="bg-gradient-success shadow-success border-radius-lg pt-4 pb-3">
                <h6 class="text-white text-capitalize ps-3">Recyclable Trash Detection</h6>
              </div>
            </div>
            <div class="card-body px-0 pb-2">
              <div class="table-responsive p-0">
                <table class="table align-items-center mb-0">
                  <thead>
                    <tr>
                      <th class="text-uppercase text-success text-xxs font-weight-bolder opacity-7">Trash Name</th>
                      <th class="text-uppercase text-success text-xxs font-weight-bolder opacity-7 ps-2">Category</th>
                      <th class="text-center text-uppercase text-success text-xxs font-weight-bolder opacity-7">Status</th>
                      <th class="text-center text-uppercase text-success text-xxs font-weight-bolder opacity-7">Detected On</th>
                      <th class="text-secondary opacity-7"></th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td>
                        <div class="d-flex px-2 py-1">
                          <div class="d-flex flex-column justify-content-center">
                            <h6 class="mb-0 text-sm">Banana Peel</h6>
                            <p class="text-xs text-secondary mb-0">Detected by CV</p>
                          </div>
                        </div>
                      </td>
                      <td>
                        <p class="text-xs font-weight-bold mb-0">Biodegradable</p>
                      </td>
                      <td class="align-middle text-center text-sm">
                        <span class="badge badge-sm bg-gradient-success">Confirmed</span>
                      </td>
                      <td class="align-middle text-center">
                        <span class="text-secondary text-xs font-weight-bold">2025-04-24</span>
                      </td>
                      <td class="align-middle">
                        <a href="javascript:;" class="text-success font-weight-bold text-xs">Details</a>
                      </td>
                    </tr>
                    <!-- Example static row, more can be added here -->
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

{% endblock content %}
